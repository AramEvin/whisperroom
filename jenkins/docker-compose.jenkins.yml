# Run Jenkins separately from the app
# Usage: docker compose -f jenkins/docker-compose.jenkins.yml up -d

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"     # Jenkins web UI
      - "50000:50000"   # Jenkins agent port
    volumes:
      - jenkins_home:/var/jenkins_home          # persist Jenkins data
      - /var/run/docker.sock:/var/run/docker.sock  # share host Docker socket
      - /usr/bin/docker:/usr/bin/docker            # share Docker binary
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - jenkins_net

volumes:
  jenkins_home:

networks:
  jenkins_net:
    driver: bridge
