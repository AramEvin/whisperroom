upstream whisperroom_app {
    server app:5000 max_fails=5 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;

    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;

    access_log /var/log/nginx/whisperroom.access.log;
    error_log  /var/log/nginx/whisperroom.error.log;

    client_max_body_size 1M;

    # Socket.IO — WebSocket upgrade
    location /socket.io/ {
        proxy_pass         http://whisperroom_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Search API — explicit rule to preserve query string
    location ~* ^/room/[^/]+/search {
        proxy_pass         http://whisperroom_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass query string explicitly
        proxy_pass_request_headers on;
        proxy_read_timeout 30;
    }

    # All other routes
    location / {
        proxy_pass         http://whisperroom_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
        proxy_connect_timeout 10;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
