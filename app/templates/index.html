<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WhisperRoom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #111118; --border: #1e1e2e;
      --accent: #7c3aed; --accent-glow: rgba(124,58,237,0.3);
      --text: #e2e8f0; --muted: #4a5568; --green: #34d399;
      --yellow: #fbbf24;
      --mono: 'IBM Plex Mono', monospace; --display: 'Syne', sans-serif;
    }

    body {
      background: var(--bg); color: var(--text); font-family: var(--mono);
      height: 100dvh; display: grid; grid-template-rows: auto 1fr auto auto; overflow: hidden;
    }

    /* ── Header ── */
    header {
      z-index: 1; display: flex; align-items: center;
      justify-content: space-between; padding: 14px 24px;
      border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .logo { font-family: var(--display); font-size: 1.35rem; font-weight: 800; letter-spacing: -0.03em; color: #fff; }
    .logo span { color: var(--accent); }
    .status { display: flex; align-items: center; gap: 8px; font-size: 0.73rem; color: var(--muted); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background 0.3s, box-shadow 0.3s; flex-shrink: 0; }
    .dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }

    /* ── Layout ── */
    main { display: grid; grid-template-columns: 1fr 220px; overflow: hidden; min-height: 0; }

    /* ── Messages ── */
    #messages {
      overflow-y: auto; padding: 16px 20px;
      display: flex; flex-direction: column; gap: 10px;
      border-right: 1px solid var(--border);
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message { display: flex; flex-direction: column; gap: 3px; max-width: 80%; animation: fadeUp 0.18s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

    .message.system { max-width: 100%; align-self: center; }
    .message.system .bubble {
      background: transparent; color: var(--muted); font-size: 0.7rem;
      text-align: center; border: none; padding: 1px 0; letter-spacing: 0.02em;
    }

    .meta { display: flex; align-items: center; gap: 7px; }
    .nick { font-size: 0.7rem; font-weight: 500; color: var(--accent); }
    .nick.mine { color: var(--green); }
    .time {
      font-size: 0.62rem; color: transparent;
      transition: color 0.2s;
    }
    .message:hover .time { color: var(--muted); }

    .bubble {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 2px 8px 8px 8px; padding: 8px 12px;
      font-size: 0.85rem; line-height: 1.55; word-break: break-word;
      transition: border-color 0.15s;
    }
    .bubble.mine {
      background: #150e2a; border-color: #3d1f7a;
      border-radius: 8px 2px 8px 8px;
    }
    .message:hover .bubble { border-color: #2e2e45; }
    .message:hover .bubble.mine { border-color: var(--accent); }

    /* ── Typing indicator ── */
    #typing-bar {
      min-height: 22px; padding: 0 20px 4px;
      font-size: 0.68rem; color: var(--yellow);
      border-right: 1px solid var(--border);
      display: flex; align-items: center; gap: 6px;
      transition: opacity 0.2s;
    }
    #typing-bar.empty { opacity: 0; }
    .typing-dots span {
      display: inline-block; width: 4px; height: 4px; border-radius: 50%;
      background: var(--yellow); margin: 0 1px;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-4px)} }

    /* ── Sidebar ── */
    #sidebar { padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 0; }
    .sidebar-title {
      font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .online-count {
      background: var(--border); color: var(--green);
      font-size: 0.58rem; padding: 2px 7px; border-radius: 10px; font-weight: 500;
    }
    #user-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
    #user-list li {
      font-size: 0.76rem; color: var(--text);
      display: flex; align-items: center; gap: 6px;
      padding: 3px 0;
      animation: fadeUp 0.2s ease;
    }
    #user-list li::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%;
      background: var(--green); flex-shrink: 0;
      box-shadow: 0 0 4px var(--green);
    }
    .you-badge {
      font-size: 0.58rem; color: var(--accent);
      border: 1px solid var(--accent); padding: 1px 4px; border-radius: 3px; margin-left: auto;
    }

    /* ── Footer ── */
    footer {
      z-index: 1; display: flex; gap: 10px;
      padding: 12px 20px; border-top: 1px solid var(--border); background: var(--surface);
    }
    #msg-input {
      flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      font-family: var(--mono); font-size: 0.85rem; padding: 9px 14px;
      border-radius: 6px; outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    #msg-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    #msg-input::placeholder { color: var(--muted); }
    #msg-input:disabled, #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #send-btn {
      background: var(--accent); color: #fff; border: none; font-family: var(--mono);
      font-size: 0.78rem; font-weight: 500; padding: 9px 18px;
      border-radius: 6px; cursor: pointer; transition: opacity 0.15s, box-shadow 0.15s;
      white-space: nowrap;
    }
    #send-btn:hover:not(:disabled) { opacity: 0.82; box-shadow: 0 0 14px var(--accent-glow); }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      main { grid-template-columns: 1fr; }
      #sidebar { display: none; }
      #typing-bar { border-right: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Whisper<span>Room</span></div>
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="status-text">connecting...</span>
    </div>
  </header>

  <main>
    <div id="messages"></div>
    <aside id="sidebar">
      <div class="sidebar-title">
        Online now
        <span class="online-count" id="online-count">0</span>
      </div>
      <ul id="user-list"></ul>
    </aside>
  </main>

  <!-- Typing indicator row sits between main and footer -->
  <div id="typing-bar" class="empty">
    <div class="typing-dots"><span></span><span></span><span></span></div>
    <span id="typing-text"></span>
  </div>

  <footer>
    <input id="msg-input" type="text" placeholder="type a message..." maxlength="500" autocomplete="off" disabled />
    <button id="send-btn" disabled>Send ↑</button>
  </footer>

  <script>
    // ── Identity ──
    const ADJECTIVES = ['silent','hidden','ghost','dark','quick','calm','wild','lost','cool','pale','swift','brave','grim','odd','shy'];
    const NOUNS      = ['panda','fox','wolf','crow','moth','lynx','hawk','frog','deer','bear','owl','crab','newt','vole','ibis'];
    const myNick = ADJECTIVES[Math.floor(Math.random()*ADJECTIVES.length)] + '_' + NOUNS[Math.floor(Math.random()*NOUNS.length)];

    // ── DOM ──
    const messagesEl  = document.getElementById('messages');
    const inputEl     = document.getElementById('msg-input');
    const sendBtn     = document.getElementById('send-btn');
    const dotEl       = document.getElementById('dot');
    const statusEl    = document.getElementById('status-text');
    const userListEl  = document.getElementById('user-list');
    const countEl     = document.getElementById('online-count');
    const typingBar   = document.getElementById('typing-bar');
    const typingText  = document.getElementById('typing-text');

    // ── Typing state ──
    let typingTimer = null;
    let isTyping = false;
    const typingUsers = new Set();   // who is currently typing

    // ── Socket ──
    const socket = io();

    socket.on('connect', () => {
      dotEl.classList.add('connected');
      statusEl.textContent = 'connected as ' + myNick;
      inputEl.disabled = false;
      sendBtn.disabled = false;
      socket.emit('user_join', { nick: myNick });
      addSystemMessage('👻 You joined as <strong>' + myNick + '</strong>');
    });

    socket.on('disconnect', () => {
      dotEl.classList.remove('connected');
      statusEl.textContent = 'disconnected';
      inputEl.disabled = true;
      sendBtn.disabled = true;
      addSystemMessage('⚠️ Connection lost. Reconnecting...');
    });

    // ── User list ──
    socket.on('user_list', (data) => {
      userListEl.innerHTML = '';
      countEl.textContent = data.users.length;
      data.users.forEach(nick => {
        const li = document.createElement('li');
        const isMe = nick === myNick;
        li.innerHTML = esc(nick) + (isMe ? ' <span class="you-badge">you</span>' : '');
        userListEl.appendChild(li);
      });
    });

    socket.on('user_joined', (data) => {
      if (data.nick !== myNick) addSystemMessage('→ <strong>' + esc(data.nick) + '</strong> joined');
    });

    socket.on('user_left', (data) => {
      typingUsers.delete(data.nick);
      renderTyping();
      addSystemMessage('← <strong>' + esc(data.nick) + '</strong> left');
    });

    // ── Messages ──
    socket.on('new_message', (data) => {
      // Clear their typing indicator when they send
      typingUsers.delete(data.nick);
      renderTyping();
      addMessage(data.nick, data.text, data.nick === myNick);
    });

    // ── Typing indicator ──
    socket.on('user_typing', (data) => {
      if (data.nick === myNick) return;
      if (data.typing) {
        typingUsers.add(data.nick);
      } else {
        typingUsers.delete(data.nick);
      }
      renderTyping();
    });

    function renderTyping() {
      const names = [...typingUsers];
      if (names.length === 0) {
        typingBar.classList.add('empty');
        typingText.textContent = '';
      } else {
        typingBar.classList.remove('empty');
        if (names.length === 1) {
          typingText.textContent = names[0] + ' is typing...';
        } else if (names.length === 2) {
          typingText.textContent = names[0] + ' and ' + names[1] + ' are typing...';
        } else {
          typingText.textContent = names.length + ' people are typing...';
        }
      }
    }

    // ── Input handling ──
    inputEl.addEventListener('input', () => {
      if (!isTyping) {
        isTyping = true;
        socket.emit('typing', { nick: myNick, typing: true });
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        isTyping = false;
        socket.emit('typing', { nick: myNick, typing: false });
      }, 1500);
    });

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || !socket.connected) return;
      // Stop typing indicator
      clearTimeout(typingTimer);
      isTyping = false;
      socket.emit('typing', { nick: myNick, typing: false });
      socket.emit('send_message', { nick: myNick, text: text });
      inputEl.value = '';
    }

    // ── Render helpers ──
    function addMessage(nick, text, isMe) {
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const div = document.createElement('div');
      div.className = 'message';
      div.style.alignSelf = isMe ? 'flex-end' : 'flex-start';
      div.innerHTML =
        '<div class="meta">' +
          '<span class="nick ' + (isMe ? 'mine' : '') + '">' + esc(nick) + '</span>' +
          '<span class="time">' + now + '</span>' +
        '</div>' +
        '<div class="bubble ' + (isMe ? 'mine' : '') + '">' + esc(text) + '</div>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addSystemMessage(html) {
      const div = document.createElement('div');
      div.className = 'message system';
      div.innerHTML = '<div class="bubble">' + html + '</div>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function esc(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
