#version: "3.9"

services:
  app:
    build: .
    container_name: whisperroom
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: sqlite:////app/instance/whisperroom.db
    volumes:
      - db_data:/app/instance      # persist SQLite database
    ports:
      - "5000:5000"                # expose directly (or use nginx below)
    networks:
      - whisperroom_net

  nginx:
    image: nginx:alpine
    container_name: whisperroom_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/whisperroom.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - whisperroom_net

volumes:
  db_data:

networks:
  whisperroom_net:
    driver: bridge
