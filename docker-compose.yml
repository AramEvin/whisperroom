services:
  app:
    build: .
    container_name: whisperroom
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: sqlite:////app/instance/whisperroom.db
    volumes:
      - db_data:/app/instance
    expose:
      - "5000:5000"
    networks:
      - whisperroom_net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: whisperroom_nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
    depends_on:
      - app
    networks:
      - whisperroom_net

volumes:
  db_data:

networks:
  whisperroom_net:
    driver: bridge
