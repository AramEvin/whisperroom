<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WhisperRoom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #111118; --border: #1e1e2e;
      --accent: #7c3aed; --accent-glow: rgba(124,58,237,0.3);
      --text: #e2e8f0; --muted: #4a5568; --green: #34d399;
      --mono: 'IBM Plex Mono', monospace; --display: 'Syne', sans-serif;
    }
    body {
      background: var(--bg); color: var(--text); font-family: var(--mono);
      height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
    }
    header {
      position: relative; z-index: 1; display: flex; align-items: center;
      justify-content: space-between; padding: 16px 24px;
      border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .logo { font-family: var(--display); font-size: 1.4rem; font-weight: 800; letter-spacing: -0.03em; color: #fff; }
    .logo span { color: var(--accent); }
    .status { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--muted); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background 0.3s, box-shadow 0.3s; }
    .dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    main { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 220px; overflow: hidden; }
    #messages {
      overflow-y: auto; padding: 20px 24px;
      display: flex; flex-direction: column; gap: 12px;
      border-right: 1px solid var(--border);
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .message { display: flex; flex-direction: column; gap: 3px; max-width: 85%; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .message.system { max-width: 100%; align-self: center; }
    .message.system .bubble { background: transparent; color: var(--muted); font-size: 0.72rem; text-align: center; border: none; padding: 2px 0; }
    .meta { display: flex; align-items: center; gap: 8px; }
    .nick { font-size: 0.72rem; font-weight: 500; color: var(--accent); }
    .nick.mine { color: var(--green); }
    .time { font-size: 0.65rem; color: var(--muted); }
    .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 2px 8px 8px 8px; padding: 8px 12px; font-size: 0.875rem; line-height: 1.5; word-break: break-word; }
    .bubble.mine { background: #1a1030; border-color: var(--accent); border-radius: 8px 2px 8px 8px; }
    #sidebar { padding: 16px; overflow-y: auto; }
    .sidebar-title { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
    #user-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    #user-list li { font-size: 0.78rem; color: var(--text); display: flex; align-items: center; gap: 6px; }
    #user-list li::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .you-badge { font-size: 0.6rem; color: var(--accent); border: 1px solid var(--accent); padding: 1px 4px; border-radius: 3px; }
    footer {
      position: relative; z-index: 1; display: flex; gap: 10px;
      padding: 14px 24px; border-top: 1px solid var(--border); background: var(--surface);
    }
    #msg-input {
      flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      font-family: var(--mono); font-size: 0.875rem; padding: 10px 14px;
      border-radius: 6px; outline: none; transition: border-color 0.15s;
    }
    #msg-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    #msg-input::placeholder { color: var(--muted); }
    #msg-input:disabled, #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #send-btn {
      background: var(--accent); color: #fff; border: none; font-family: var(--mono);
      font-size: 0.8rem; font-weight: 500; padding: 10px 18px; border-radius: 6px;
      cursor: pointer; transition: opacity 0.15s, box-shadow 0.15s;
    }
    #send-btn:hover { opacity: 0.85; box-shadow: 0 0 12px var(--accent-glow); }
    @media (max-width: 600px) { main { grid-template-columns: 1fr; } #sidebar { display: none; } }
  </style>
</head>
<body>
  <header>
    <div class="logo">Whisper<span>Room</span></div>
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="status-text">connecting...</span>
    </div>
  </header>

  <main>
    <div id="messages"></div>
    <aside id="sidebar">
      <div class="sidebar-title">Online now</div>
      <ul id="user-list"></ul>
    </aside>
  </main>

  <footer>
    <input id="msg-input" type="text" placeholder="type a message... (press Enter)" maxlength="500" autocomplete="off" disabled />
    <button id="send-btn" disabled>Send ↑</button>
  </footer>

  <script>
    const ADJECTIVES = ['silent','hidden','ghost','dark','quick','calm','wild','lost','cool','pale'];
    const NOUNS      = ['panda','fox','wolf','crow','moth','lynx','hawk','frog','deer','bear'];
    const myNick = ADJECTIVES[Math.floor(Math.random()*10)] + '_' + NOUNS[Math.floor(Math.random()*10)];

    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('msg-input');
    const sendBtn    = document.getElementById('send-btn');
    const dotEl      = document.getElementById('dot');
    const statusEl   = document.getElementById('status-text');
    const userListEl = document.getElementById('user-list');

    const socket = io();

    socket.on('connect', () => {
      dotEl.classList.add('connected');
      statusEl.textContent = 'connected as ' + myNick;
      inputEl.disabled = false;
      sendBtn.disabled = false;
      const li = document.createElement('li');
      li.innerHTML = myNick + ' <span class="you-badge">you</span>';
      userListEl.appendChild(li);
      addSystemMessage('👻 You joined as <strong>' + myNick + '</strong>');
    });

    socket.on('disconnect', () => {
      dotEl.classList.remove('connected');
      statusEl.textContent = 'disconnected';
      inputEl.disabled = true;
      sendBtn.disabled = true;
      addSystemMessage('⚠️ Connection lost. Reconnecting...');
    });

    socket.on('new_message', (data) => {
      addMessage(data.nick, data.text, data.nick === myNick);
    });

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || !socket.connected) return;
      socket.emit('send_message', { nick: myNick, text: text });
      inputEl.value = '';
    }

    function addMessage(nick, text, isMe) {
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const div = document.createElement('div');
      div.className = 'message';
      div.style.alignSelf = isMe ? 'flex-end' : 'flex-start';
      div.innerHTML =
        '<div class="meta">' +
          '<span class="nick ' + (isMe ? 'mine' : '') + '">' + esc(nick) + '</span>' +
          '<span class="time">' + now + '</span>' +
        '</div>' +
        '<div class="bubble ' + (isMe ? 'mine' : '') + '">' + esc(text) + '</div>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addSystemMessage(html) {
      const div = document.createElement('div');
      div.className = 'message system';
      div.innerHTML = '<div class="bubble">' + html + '</div>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function esc(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
