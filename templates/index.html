<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WhisperRoom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #7c3aed;
      --accent-glow: rgba(124, 58, 237, 0.3);
      --text: #e2e8f0;
      --muted: #4a5568;
      --green: #34d399;
      --mono: 'IBM Plex Mono', monospace;
      --display: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    /* Subtle noise texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* HEADER */
    header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .logo {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
    }

    .logo span {
      color: var(--accent);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* MAIN LAYOUT */
    main {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 220px;
      overflow: hidden;
    }

    /* MESSAGES */
    #messages {
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-right: 1px solid var(--border);
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 85%;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.system {
      max-width: 100%;
      align-self: center;
    }

    .message.system .bubble {
      background: transparent;
      color: var(--muted);
      font-size: 0.72rem;
      text-align: center;
      border: none;
      padding: 2px 0;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nick {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--accent);
    }

    .time {
      font-size: 0.65rem;
      color: var(--muted);
    }

    .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px 8px 8px 8px;
      padding: 8px 12px;
      font-size: 0.875rem;
      line-height: 1.5;
      word-break: break-word;
    }

    /* SIDEBAR */
    #sidebar {
      padding: 16px;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    #user-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #user-list li {
      font-size: 0.78rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #user-list li::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    .you-badge {
      font-size: 0.6rem;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* INPUT */
    footer {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 10px;
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    #msg-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.875rem;
      padding: 10px 14px;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
    }

    #msg-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    #msg-input::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.15s, box-shadow 0.15s;
    }

    #send-btn:hover {
      opacity: 0.85;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Responsive */
    @media (max-width: 600px) {
      main { grid-template-columns: 1fr; }
      #sidebar { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Whisper<span>Room</span></div>
    <div class="status">
      <div class="dot"></div>
      <span id="status-text">connecting...</span>
    </div>
  </header>

  <main>
    <div id="messages">
      <!-- messages appear here -->
    </div>

    <aside id="sidebar">
      <div class="sidebar-title">Online now</div>
      <ul id="user-list">
        <!-- users appear here -->
      </ul>
    </aside>
  </main>

  <footer>
    <input id="msg-input" type="text" placeholder="type a message... (press Enter)" maxlength="500" autocomplete="off" />
    <button id="send-btn">Send ↑</button>
  </footer>

  <script>
    // ── Placeholder data for Step 1 (no real-time yet) ──
    const myNick = 'ghost_' + Math.floor(Math.random() * 9000 + 1000);

    document.getElementById('status-text').textContent = 'Step 1 – UI preview';

    // Render self in sidebar
    const userList = document.getElementById('user-list');
    const li = document.createElement('li');
    li.innerHTML = `${myNick} <span class="you-badge">you</span>`;
    userList.appendChild(li);

    // Add a system welcome message
    addSystemMessage(`Welcome to WhisperRoom. You are ${myNick}.`);
    addSystemMessage('Real-time chat coming in Step 2 🔌');

    // Input handling
    const input = document.getElementById('msg-input');
    const btn   = document.getElementById('send-btn');

    btn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(myNick, text, true);
      input.value = '';
    }

    function addMessage(nick, text, isMe = false) {
      const msgs = document.getElementById('messages');
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const div = document.createElement('div');
      div.className = 'message';
      div.style.alignSelf = isMe ? 'flex-end' : 'flex-start';
      div.innerHTML = `
        <div class="meta">
          <span class="nick">${nick}</span>
          <span class="time">${now}</span>
        </div>
        <div class="bubble">${escapeHtml(text)}</div>
      `;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function addSystemMessage(text) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message system';
      div.innerHTML = `<div class="bubble">${text}</div>`;
      msgs.appendChild(div);
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
